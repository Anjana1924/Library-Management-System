services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/library_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      CLIENT_URL: http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@library.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"   # optional: only needed to call the API directly

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo_data: